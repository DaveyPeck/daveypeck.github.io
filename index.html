<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ticket To Prod</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <button class="theme-toggle" id="theme-toggle" type="button">[ DARK MODE ]</button>
    <div class="app">
      <div class="viewport" id="viewport">
        <pre class="screen" id="screen"></pre>
      </div>
      <div class="status">
        <div>
          <h4>Controls:</h4>
          <span id="status-controls">WASD Move | E Interact</span>
        </div>
        <div>
          <h4>Objective:</h4>
          <span id="status-objective"></span>
        </div>
        <div>
          <h4>Current Phase:</h4>
          <span id="status-phase"></span>
        </div>
        <div class="dialogue">
          <h4>Dialogue:</h4>
          <span id="status-dialogue"></span>
        </div>
      </div>
    </div>

    <!-- Plain scripts (no modules) so the game works straight from file:// -->
    <script src="src/game/map.js"></script>
    <script src="src/game/puzzle.js"></script>
    <script src="src/game/platformer.js"></script>
    <script src="src/game/battle.js"></script>
    <script src="src/game/lead.js"></script>
    <script src="src/game/qa.js"></script>
    <script src="src/game/po.js"></script>
    <script src="src/game/ba.js"></script>
    <script src="src/game/scenes.js"></script>
    <script src="src/game/state.js"></script>
    <script src="src/render.js"></script>
    <script src="src/main.js"></script>
  </body>
</html>
